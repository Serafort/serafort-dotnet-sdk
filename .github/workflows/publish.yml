name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Pack & Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test Serafort.SDK.Tests/Serafort.SDK.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Serafort.SDK.csproj -c Release --no-build -o out

      - name: Add GitHub Packages source
        run: dotnet nuget add source --username Serafort --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Serafort/index.json"

      - name: Push
        run: dotnet nuget push "out/*.nupkg" --source github --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
